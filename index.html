<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Summarizer | Smart Text Summarizer</title>

  <meta name="description" content="Summarize text with AI, directly in your browser and without sending any data to a server.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>Smart Summarizer</h1>

      <p>
        Enter your text and let the AI summarize it for you, right inside your browser.
      </p>

      <span class="privacy">
        🔒 Your data never leaves your device
      </span>
      <button id="themeToggle" class="theme-toggle">🌙 Dark mode</button>
    </header>

    <section class="card">

      <textarea id="input" placeholder="Type or paste your text here..."></textarea>

      <div id="counter">0 words | 0 characters</div>

      <div class="summary-options">
        <label for="summaryLength">Summary length:</label>

        <select id="summaryLength">
          <option value="40">Short</option>
          <option value="70" selected>Medium</option>
          <option value="120">Long</option>
        </select>
      </div>

      <div class="buttons">
        <button id="summarizeBtn">Summarize</button>
        <button id="clearBtn">Clear</button>
      </div>

    </section>

    <section class="result-card">

      <h2>Summary</h2>

      <div class="model-status loading" id="modelStatus">
        <span class="status-dot"></span>
        <span id="statusText">Preparing the model...</span>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="output">
        The summary will appear here.
      </div>

      <button id="copyBtn">Copy summary</button>

    </section>

  </main>

  <script type="module" src="app.js"></script>

</body>

</html>
